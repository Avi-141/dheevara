<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chakravyūha — Dheevara</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Sanskrit:ital@0;1&display=swap">
<style>
:root{--night:#0D0E0B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--night)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--night:#0D0E0B}}
:root[data-theme="dark"]{--night:#0D0E0B}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--night)}
</style>
</head>
<body>
<script>
(() => {
'use strict';

/* ─────────────────────────────  setup  ───────────────────────────── */
const TAU = Math.PI * 2, PI = Math.PI;
const FONT = '"Tiro Devanagari Sanskrit","Noto Serif Devanagari","Kohinoor Devanagari",Georgia,serif';
const C = {
  night: '#0D0E0B', parch: '#EFE6D2', ash: '#A39B88', gold: '#E3B04B',
  flame: '#FBE3A4', sindoor: '#C8391F', fallen: 'rgba(74,66,52,0.9)'
};
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const finePointer = matchMedia('(pointer: fine)').matches;
const args = new URLSearchParams(location.hash.slice(1));
const clean = args.has('clean'); // preview hook: scene only, no type or controls

document.body.style.userSelect = 'none';
document.body.style.webkitUserSelect = 'none';
document.body.style.webkitTapHighlightColor = 'transparent';

const cv = document.createElement('canvas');
cv.style.cssText = 'display:block;width:100%;height:100%;touch-action:none;outline:none;cursor:pointer';
cv.tabIndex = 0;
cv.setAttribute('role', 'application');
cv.setAttribute('aria-label', 'Chakravyūha. An interactive chapter. Press Enter to begin, hold Space to ride forward, press M to mute.');
document.body.appendChild(cv);
const live = document.createElement('div');
live.setAttribute('aria-live', 'polite');
live.style.cssText = 'position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap';
document.body.appendChild(live);
const ctx = cv.getContext('2d');

let W = 0, H = 0, DPR = 1, S = 1, portrait = false;
let vignette = null, grainPat = null;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const rnd = (a, b) => a + Math.random() * (b - a);
const angDist = (a, b) => { let d = ((a - b) % TAU + TAU) % TAU; return d > PI ? TAU - d : d; };

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  portrait = H > W * 1.1;
  S = Math.min(W, H);
  const vc = document.createElement('canvas');
  vc.width = Math.max(2, Math.round(W / 3)); vc.height = Math.max(2, Math.round(H / 3));
  const v = vc.getContext('2d');
  const g = v.createRadialGradient(vc.width / 2, vc.height * 0.5, Math.min(vc.width, vc.height) * 0.22,
    vc.width / 2, vc.height * 0.5, Math.hypot(vc.width, vc.height) * 0.6);
  g.addColorStop(0, 'rgba(5,5,4,0)'); g.addColorStop(1, 'rgba(5,5,4,0.82)');
  v.fillStyle = g; v.fillRect(0, 0, vc.width, vc.height);
  vignette = vc;
}
(function buildGrain() {
  const g = document.createElement('canvas'); g.width = g.height = 180;
  const gx = g.getContext('2d'); const id = gx.createImageData(180, 180);
  for (let i = 0; i < id.data.length; i += 4) {
    const v = (Math.random() * 255) | 0;
    id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255;
  }
  gx.putImageData(id, 0, 0);
  grainPat = ctx.createPattern(g, 'repeat');
})();

function makeGlow(inner, mid) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, inner); gr.addColorStop(0.22, mid); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  return c;
}
const glowGold = makeGlow('rgba(255,246,220,1)', 'rgba(242,168,58,0.5)');
const glowRed = makeGlow('rgba(255,196,160,0.95)', 'rgba(200,57,31,0.55)');
const glowSilver = makeGlow('rgba(236,242,255,0.95)', 'rgba(150,172,214,0.4)');

/* ─────────────────────────────  the wheel  ───────────────────────────── */
// Seven rings: six walls, then the Chakra-vyuha spiral at the core, as on the
// Hoysala friezes at Halebidu (a classical labyrinth whose centre is a spiral).
const WALLS = [1.0, 0.9, 0.8, 0.7, 0.6, 0.5];
const CORR = [0.95, 0.85, 0.75, 0.65, 0.55, 0.46];
const BREAK_A = [-90, -20, 70, 160, 250, 340].map(d => d * PI / 180);
const SP = { r0: 0.42, pitch: 0.155, a0: 60 * PI / 180 + 0.35, turns: 2.25 };
const spiralR = a => SP.r0 - SP.pitch * (a - SP.a0) / TAU;
const ENTRY_A = 60 * PI / 180 + TAU;
const WALL_H = 0.06, WALL_T = 0.026, WARRIOR_H = 0.024;
const SEG = 240, A0 = -PI / 2;
const COS = new Float32Array(SEG + 1), SIN = new Float32Array(SEG + 1);
for (let j = 0; j <= SEG; j++) { COS[j] = Math.cos(A0 + TAU * j / SEG); SIN[j] = Math.sin(A0 + TAU * j / SEG); }
const SPN = 420;
const SPX = new Float32Array(SPN + 1), SPY = new Float32Array(SPN + 1);
for (let j = 0; j <= SPN; j++) {
  const a = SP.a0 + SP.turns * TAU * j / SPN, r = spiralR(a);
  SPX[j] = r * Math.cos(a); SPY[j] = r * Math.sin(a);
}

// Abhimanyu's path: through the gate, round each corridor, into the spiral.
const pX = [], pY = [], pA = [], pR = [], pL = [];
const breakL = []; let spiralL = 0, endL = 0;
function addPt(r, a) {
  const x = r * Math.cos(a), y = r * Math.sin(a), n = pX.length;
  pL.push(n ? pL[n - 1] + Math.hypot(x - pX[n - 1], y - pY[n - 1]) : 0);
  pX.push(x); pY.push(y); pA.push(a); pR.push(r);
}
(function buildPath() {
  let r = 1.2, a = BREAK_A[0];
  addPt(r, a);
  const radial = r1 => { const r0 = r, n = Math.max(1, Math.ceil(Math.abs(r1 - r0) / 0.01)); for (let i = 1; i <= n; i++) addPt(r0 + (r1 - r0) * i / n, a); r = r1; };
  const arc = a1 => { const a0 = a, n = Math.max(1, Math.ceil(Math.abs(a1 - a0) * r / 0.012)); for (let i = 1; i <= n; i++) addPt(r, a0 + (a1 - a0) * i / n); a = a1; };
  for (let i = 0; i < 6; i++) {
    radial(WALLS[i]); breakL.push(pL[pL.length - 1]);
    radial(CORR[i]); arc(i < 5 ? BREAK_A[i + 1] : ENTRY_A);
  }
  spiralL = pL[pL.length - 1];
  radial(0.351);
  const u1 = 1.12, n = Math.ceil(u1 * TAU * 0.25 / 0.012), aS = a;
  for (let i = 1; i <= n; i++) { const u = u1 * i / n; addPt(0.351 - SP.pitch * u, aS + u * TAU); }
  endL = pL[pL.length - 1];
})();
let seg = 0, px = 0, py = 0, pa = 0;
function pathAt(s) {
  while (seg < pL.length - 2 && pL[seg + 1] < s) seg++;
  while (seg > 0 && pL[seg] > s) seg--;
  const l0 = pL[seg], l1 = pL[seg + 1], t = l1 > l0 ? clamp((s - l0) / (l1 - l0), 0, 1) : 0;
  px = lerp(pX[seg], pX[seg + 1], t); py = lerp(pY[seg], pY[seg + 1], t); pa = lerp(pA[seg], pA[seg + 1], t);
}

/* ─────────────────────────────  camera  ───────────────────────────── */
const cam = { yaw: 0.6, pitch: 0, zoom: 0.92, tx: 0, ty: 0, cy: 0.5 };
const camT = { yaw: 0.6, pitch: 0, zoom: 0.92, tx: 0, ty: 0, cy: 0.5 };
let cyw = 1, syw = 0, cp = 1, sp = 0, F = 1, shx = 0, shy = 0;
let _x = 0, _y = 0, _k = 0;
const DIST = 3.2;
function camPrep() {
  cyw = Math.cos(cam.yaw); syw = Math.sin(cam.yaw);
  cp = Math.cos(cam.pitch); sp = Math.sin(cam.pitch);
  F = S * (portrait ? 1.16 : 1.26) * cam.zoom;
}
function P(x, y, z) {
  x -= cam.tx; y -= cam.ty;
  const xr = x * cyw - y * syw, yr = x * syw + y * cyw;
  const Y = yr * cp + z * sp, D = DIST + yr * sp - z * cp, k = F / D;
  _x = W * 0.5 + xr * k + shx; _y = H * cam.cy - Y * k + shy; _k = k;
}

/* ─────────────────────────────  world state  ───────────────────────────── */
const OMEGA = [0.05, -0.06, 0.07, -0.08, 0.09, -0.1];
const warriors = [];
const dust = [];
for (let i = 0; i < 520; i++) { const r = Math.sqrt(Math.random()) * 1.55, a = Math.random() * TAU; dust.push([r * Math.cos(a), r * Math.sin(a), Math.random()]); }
let parts = [], broken = [], trail = [], pend = [];
const wallProg = new Float32Array(7);
let warriorAlpha = 0, wheel = 0;
let s = 0, vel = 0, nextBreak = 0, charge = 0, ringsBroken = 0;
let abhiI = 0, flameOut = 0, wheelGlyph = 0, stuckPush = 0;
let barrier = 0, hotspot = false, revealOpen = false, revealSeen = false, revealClosedAt = 0;
let sunset = 0, endUI = 0, flash = 0, shake = 0;
let heldEver = false, idle = 0, holding = false, stuckHint = false;
const pandavas = [];
const six = [];
let phase = 'start', pt = 0, clock = 0;
const fired = new Set();
let cap = { text: '', t: 0, dur: 0 };
let distAcc = 0, lastClash = 0;

function makeWarriors() {
  warriors.length = 0;
  for (let c = 0; c < 6; c++) {
    const n = Math.round(300 * CORR[c]);
    for (const dr of [-0.024, 0.022]) {
      for (let j = 0; j < n; j++) {
        if (Math.random() < 0.08) continue;
        warriors.push({ c, r: CORR[c] + dr + rnd(-0.006, 0.006), a: TAU * j / n + rnd(-0.012, 0.012), st: 0, u: 0, glint: j % 5 === 0, h: rnd(0.7, 1.2), dark: Math.random() < 0.38 });
      }
    }
  }
  for (let j = 0; j < 240; j++) warriors.push({ c: 6, u: 2.08 * j / 240 + rnd(-0.004, 0.004), off: (j % 2 ? 0.022 : -0.022) + rnd(-0.005, 0.005), a: 0, r: 0, st: 0, glint: j % 4 === 0, h: rnd(0.7, 1.2), dark: Math.random() < 0.38 });
}
function resetWorld() {
  makeWarriors();
  parts = []; broken = []; trail = []; pend = [];
  wallProg.fill(0); warriorAlpha = 0; wheel = 0;
  s = 0; seg = 0; vel = 0; nextBreak = 0; charge = 0; ringsBroken = 0;
  abhiI = 0; flameOut = 0; wheelGlyph = 0; stuckPush = 0;
  barrier = 0; hotspot = false; revealOpen = false; revealSeen = false; revealClosedAt = 0;
  sunset = 0; endUI = 0; flash = 0; shake = 0; heldEver = false; idle = 0; stuckHint = false;
  pandavas.length = 0;
  for (const d of [-12, -5, 5, 12]) pandavas.push({ a: -PI / 2 + d * PI / 180, r: 1.24, tr: 1.24 });
  six.length = 0;
  for (let i = 0; i < 6; i++) six.push({ ang: i * TAU / 6, rad: 0.26, on: 0 });
  fired.clear(); cap = { text: '', t: 0, dur: 0 };
  Object.assign(camT, { yaw: 0.6, pitch: 0, zoom: 0.92, tx: 0, ty: 0, cy: 0.5 });
  Object.assign(cam, camT);
}

// Every caption carries its source line, with the same claim ids as the video (content/canon/claims/s1e3.json).
function say(text, dur = 4.6, cite = '') { cap = { text, t: 0, dur, cite }; live.textContent = cite ? `${text} (Mahābhārata ${cite})` : text; }
function later(t, fn) { pend.push({ t, fn }); }
function go(p) { phase = p; pt = 0; }
function at(key, time, fn) { const id = phase + ':' + key; if (pt >= time && !fired.has(id)) { fired.add(id); fn(); } }

function embers(x, y, z, n, spd, col) {
  for (let i = 0; i < n; i++) parts.push({ k: 0, x, y, z, vx: rnd(-1, 1) * spd, vy: rnd(-1, 1) * spd, vz: rnd(0.05, 1) * spd + 0.04, life: 0, max: rnd(0.9, 2.6), s: rnd(0.004, 0.011), col });
}
function debris(x, y, n) {
  const a = Math.atan2(y, x);
  for (let i = 0; i < n; i++) {
    const sp2 = rnd(0.15, 0.7), da = rnd(-0.9, 0.9);
    parts.push({ k: 1, x, y, z: WALL_H * 0.8, vx: Math.cos(a + PI + da) * sp2 * rnd(-0.6, 1), vy: Math.sin(a + PI + da) * sp2 * rnd(-0.6, 1), vz: rnd(0.3, 1.1), life: 0, max: rnd(1.1, 2.2), s: rnd(0.006, 0.016) });
  }
}

/* ─────────────────────────────  sound  ───────────────────────────── */
let ac = null, master = null, bus = null, rev = null, lowpass = null, noiseBuf = null, muted = false;
const tan = {}; let tanNext = 0, drumNext = 0, windGain = null, drumsOn = false;
const SA = 110;
function audioStart() {
  if (ac) return;
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; return; }
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3.5;
  master = ac.createGain(); master.gain.value = muted ? 0 : 0.95;
  lowpass = ac.createBiquadFilter(); lowpass.type = 'lowpass'; lowpass.frequency.value = 18000;
  master.connect(lowpass); lowpass.connect(comp); comp.connect(ac.destination);
  bus = ac.createGain(); bus.connect(master);
  rev = ac.createConvolver(); rev.buffer = impulse(3.4, 2.6);
  const rg = ac.createGain(); rg.gain.value = 0.55; rev.connect(rg); rg.connect(master);
  const n = ac.sampleRate * 2; noiseBuf = ac.createBuffer(1, n, ac.sampleRate);
  const nd = noiseBuf.getChannelData(0); for (let i = 0; i < n; i++) nd[i] = Math.random() * 2 - 1;
  tan.pa = ks(SA * 0.75, 3.4); tan.sa = ks(SA, 3.4); tan.lo = ks(SA / 2, 3.8);
  tanNext = ac.currentTime + 1.2;
  setInterval(schedule, 90);
}
function impulse(sec, decay) {
  const n = Math.floor(ac.sampleRate * sec), b = ac.createBuffer(2, n, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = b.getChannelData(ch); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay); }
  return b;
}
function ks(freq, dur) {
  // Karplus–Strong string with a soft buzz, a stand-in for the tanpura's jawari
  const sr = ac.sampleRate, n = Math.floor(sr * dur), b = ac.createBuffer(1, n, sr), d = b.getChannelData(0);
  const N = Math.max(2, Math.round(sr / freq)), ring = new Float32Array(N);
  for (let i = 0; i < N; i++) ring[i] = Math.random() * 2 - 1;
  let idx = 0;
  for (let i = 0; i < n; i++) {
    const a = ring[idx], c2 = ring[(idx + 1) % N];
    ring[idx] = (a + c2) * 0.5 * 0.9985;
    d[i] = Math.tanh(a * 1.8) * 0.55 * Math.min(1, i / 60);
    idx = (idx + 1) % N;
  }
  return b;
}
function out(node, dry, wet) {
  const g = ac.createGain(); g.gain.value = dry; node.connect(g); g.connect(bus);
  if (wet > 0) { const w = ac.createGain(); w.gain.value = wet; node.connect(w); w.connect(rev); }
}
function pluck(buf, t, gain) {
  const s0 = ac.createBufferSource(); s0.buffer = buf;
  const g = ac.createGain(); g.gain.value = gain; s0.connect(g); out(g, 1, 0.4); s0.start(t);
}
function drum(t, amp = 0.8, f0 = 120, f1 = 44, len = 0.8) {
  const o = ac.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + 0.3);
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(amp, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  o.connect(g); out(g, 1, 0.22); o.start(t); o.stop(t + len + 0.05);
  const nsrc = ac.createBufferSource(); nsrc.buffer = noiseBuf;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 240; bp.Q.value = 0.8;
  const ng = ac.createGain(); ng.gain.setValueAtTime(amp * 0.45, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
  nsrc.connect(bp); bp.connect(ng); out(ng, 1, 0.15); nsrc.start(t, Math.random()); nsrc.stop(t + 0.2);
}
function tak(t, amp = 0.12, f = 2600) {
  const nsrc = ac.createBufferSource(); nsrc.buffer = noiseBuf;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = 2.2;
  const g = ac.createGain(); g.gain.setValueAtTime(amp, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
  nsrc.connect(bp); bp.connect(g); out(g, 1, 0.3); nsrc.start(t, Math.random()); nsrc.stop(t + 0.08);
}
function clash(t, amp = 0.16) {
  tak(t, amp * 1.4, 3400);
  const o = ac.createOscillator(); o.type = 'triangle';
  o.frequency.setValueAtTime(rnd(1700, 2300), t); o.frequency.exponentialRampToValueAtTime(rnd(1100, 1400), t + 0.25);
  const g = ac.createGain(); g.gain.setValueAtTime(amp * 0.35, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
  o.connect(g); out(g, 1, 0.35); o.start(t); o.stop(t + 0.35);
}
function shankh(t) {
  // conch: a reedy tone with a slow swell, a breath of noise, and a little vibrato
  const o = ac.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(176, t); o.frequency.exponentialRampToValueAtTime(196, t + 0.45);
  const vib = ac.createOscillator(); vib.frequency.value = 5.2; const vg = ac.createGain(); vg.gain.value = 0;
  vg.gain.setValueAtTime(0, t + 0.9); vg.gain.linearRampToValueAtTime(2.2, t + 1.8); vib.connect(vg); vg.connect(o.frequency);
  const f1 = ac.createBiquadFilter(); f1.type = 'bandpass'; f1.frequency.value = 780; f1.Q.value = 1.4;
  const f2 = ac.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = 2200;
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.5, t + 0.6);
  g.gain.setValueAtTime(0.5, t + 2.3); g.gain.linearRampToValueAtTime(0.0001, t + 3.6);
  o.connect(f1); f1.connect(f2); f2.connect(g); out(g, 1, 0.6);
  const nsrc = ac.createBufferSource(); nsrc.buffer = noiseBuf;
  const nb = ac.createBiquadFilter(); nb.type = 'bandpass'; nb.frequency.value = 1500; nb.Q.value = 0.7;
  const ng = ac.createGain(); ng.gain.setValueAtTime(0.0001, t); ng.gain.linearRampToValueAtTime(0.05, t + 0.5); ng.gain.linearRampToValueAtTime(0.0001, t + 3.4);
  nsrc.connect(nb); nb.connect(ng); out(ng, 1, 0.4);
  o.start(t); vib.start(t); nsrc.start(t); o.stop(t + 3.7); vib.stop(t + 3.7); nsrc.stop(t + 3.7);
}
function bell(t, base = 330, amp = 0.2) {
  const ratios = [1, 2.0, 2.76, 3.8, 5.4, 6.8];
  ratios.forEach((r, i) => {
    const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = base * r;
    const g = ac.createGain(); const a2 = amp / (1 + i * 0.9);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(a2, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + 5.5 / (1 + i * 0.35));
    o.connect(g); out(g, 1, 0.7); o.start(t); o.stop(t + 6);
  });
}
function windStart() {
  if (!ac || windGain) return;
  const nsrc = ac.createBufferSource(); nsrc.buffer = noiseBuf; nsrc.loop = true;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 420; bp.Q.value = 0.5;
  windGain = ac.createGain(); windGain.gain.value = 0.0001;
  windGain.gain.linearRampToValueAtTime(0.07, ac.currentTime + 4);
  const lfo = ac.createOscillator(); lfo.frequency.value = 0.08; const lg = ac.createGain(); lg.gain.value = 180;
  lfo.connect(lg); lg.connect(bp.frequency);
  nsrc.connect(bp); bp.connect(windGain); out(windGain, 1, 0.3); nsrc.start(); lfo.start();
}
function schedule() {
  if (!ac) return;
  const now = ac.currentTime, ahead = now + 0.35;
  const soft = phase === 'end' ? 0.55 : 1;
  while (tanNext < ahead) {
    const t = tanNext;
    pluck(tan.pa, t, 0.2 * soft); pluck(tan.sa, t + 0.66, 0.17 * soft); pluck(tan.sa, t + 1.32, 0.17 * soft); pluck(tan.lo, t + 1.98, 0.24 * soft);
    tanNext += 2.9;
  }
  if (drumsOn) {
    if (drumNext < now) drumNext = now + 0.05;
    const stuck = phase === 'stuck';
    const bpm = stuck ? 128 : 70 + ringsBroken * 9;
    const beat = 60 / bpm;
    while (drumNext < ahead) {

  write('Dheevara', cx, 44, { size: 18, color: C.gold, alpha: 0.75 });
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = C.night; ctx.fillRect(0, 0, W, H);
  hits.length = 0;
  if (phase === 'start') { drawStart(); drawFilm(); drawMute(); return; }
  camPrep();
  drawGround();
  drawWalls();
  drawWarriors();
  drawHeat();
  if (abhiI > 0) { pathAt(phase === 'ride' ? s : endL); P(px, py, 0.03); abX = _x; abY = _y; }
  drawDark();
  drawLights();
  drawSunset();
  drawFilm();
  if (clean) return;
  drawTitle();
  drawRings();
  drawHotspot();
  drawCaption();
  drawHint();
  drawEnd();
  drawReveal();
  drawMute();
}

/* ─────────────────────────────  input  ───────────────────────────── */
let downHit = null;
cv.addEventListener('pointerdown', e => {
  cv.focus();
  ptr.x = e.offsetX; ptr.y = e.offsetY; ptr.t = clock;
  const h = hitAt(e.offsetX, e.offsetY);
  if (h) { downHit = h; return; }
  if (phase === 'start') { begin(); return; }
  if (revealOpen) return;
  holding = true;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener('pointermove', e => { ptr.x = e.offsetX; ptr.y = e.offsetY; ptr.t = clock; });
const release = e => {
  holding = false;
  if (downHit && e && e.type === 'pointerup') { const h = hitAt(e.offsetX, e.offsetY); if (h && h.fn === downHit.fn) h.fn(); }
  downHit = null;
};
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (e.repeat) return; if (phase === 'start') { begin(); return; } if (!revealOpen) holding = true; return; }
  if (e.key === 'Enter') {
    e.preventDefault();
    if (phase === 'start') begin();
    else if (revealOpen) closeReveal();
    else if (hotspot && phase === 'stuck') openReveal();
    else if (phase === 'end' && endUI > 0.5) restart();
    return;
  }
  if (e.key === 'm' || e.key === 'M') setMute(!muted);
  if (e.key === 'Escape' && revealOpen) closeReveal();
});
addEventListener('keyup', e => { if (e.code === 'Space') holding = false; });
addEventListener('blur', () => { holding = false; });
addEventListener('resize', resize);

/* ─────────────────────────────  run  ───────────────────────────── */
resize();
resetWorld();
if (document.fonts && document.fonts.load) document.fonts.load(font(48, false), 'चक्रव्यूह').catch(() => {});

// Preview hooks: #at=SECONDS fast-forwards, #auto holds for you, #reveal opens the sheet, #clean hides type and controls.
if (args.has('at')) {
  phase = 'carve'; pt = 0;
  const auto = args.has('auto'), target = parseFloat(args.get('at')) || 0;
  let t = 0;
  while (t < target) { holding = auto; if (args.has('reveal') && hotspot && !revealSeen) openReveal(); update(1 / 30); t += 1 / 30; }
  holding = false;
}

let last = performance.now();
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (revealOpen) dt *= 0.25;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
