name: app

on:
  push:
    paths:
      - "apps/dheevara/**"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "apps/dheevara/**"
      - ".github/workflows/app.yml"

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/dheevara

jobs:
  linux:
    name: Core tests, Android build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check :androidApp:assembleDebug
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-reports
          path: apps/dheevara/**/build/reports/

  ios:
    name: iOS framework and simulator tests
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('apps/dheevara/gradle/libs.versions.toml') }}
      - run: >-
          ./gradlew
          :shared:core:iosSimulatorArm64Test
          :shared:ui:linkDebugFrameworkIosArm64
          :shared:ui:linkDebugFrameworkIosSimulatorArm64
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-reports
          path: apps/dheevara/**/build/reports/
