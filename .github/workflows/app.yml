name: app

on:
  push:
    paths: &paths
      - "apps/dheevara/**"
      - "content/*/manifest.json"
      - ".github/workflows/app.yml"
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/dheevara

jobs:
  linux:
    name: Core tests, Android build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check :androidApp:assembleDebug :shared:core:koverLog
      - name: Test counts
        if: always()
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import glob, xml.etree.ElementTree as ET
          rows = {}
          for f in glob.glob("**/build/test-results/*/TEST-*.xml", recursive=True):
              s = ET.parse(f).getroot()
              key = f.split("/build/")[0] + " · " + f.split("/")[-2]
              t, bad = rows.get(key, (0, 0))
              rows[key] = (t + int(s.get("tests")), bad + int(s.get("failures")) + int(s.get("errors")))
          print("| Tests | Run | Failed |\n|---|---|---|")
          for k, (t, bad) in sorted(rows.items()):
              print(f"| {k} | {t} | {bad} |")
          EOF
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-reports
          path: |
            apps/dheevara/**/build/reports/
            apps/dheevara/**/build/outputs/roborazzi/

  ios:
    name: iOS framework and simulator tests
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('apps/dheevara/gradle/libs.versions.toml') }}
      - run: >-
          ./gradlew
          :shared:core:iosSimulatorArm64Test
          :shared:ui:linkDebugFrameworkIosArm64
          :shared:ui:linkDebugFrameworkIosSimulatorArm64
      - name: Test counts
        if: always()
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import glob, xml.etree.ElementTree as ET
          rows = {}
          for f in glob.glob("**/build/test-results/*/TEST-*.xml", recursive=True):
              s = ET.parse(f).getroot()
              key = f.split("/build/")[0] + " · " + f.split("/")[-2]
              t, bad = rows.get(key, (0, 0))
              rows[key] = (t + int(s.get("tests")), bad + int(s.get("failures")) + int(s.get("errors")))
          print("| Tests | Run | Failed |\n|---|---|---|")
          for k, (t, bad) in sorted(rows.items()):
              print(f"| {k} | {t} | {bad} |")
          EOF
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-reports
          path: apps/dheevara/**/build/reports/
